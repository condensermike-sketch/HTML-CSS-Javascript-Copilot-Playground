<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Favorites</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/menu-data.js"></script>
<script src="../js/app.js"></script></head><body><div class="app-shell">
<div class="white-topbar"><a class="back-btn" href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m15 18-6-6 6-6"/></svg></a><div class="topbar-title">Favorites</div><div></div></div>
<main class="app-scroll list-page-scroll"><div class="list-page-content"><div class="page-tools"><h1 class="page-title">Favorites</h1><div class="view-toggle"><button class="active" id="gridBtn">▦</button><button id="listBtn">☰</button></div></div><div id="favorites"></div></div></main>

<nav class="bottom-nav">
  <a class="nav-btn " href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m4 10 8-6 8 6v10H4Z"/><path class="icon-stroke" d="M9 20v-6h6v6"/></svg><span>Home</span></a>
  <a class="nav-btn " href="../menu/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></a>
  <a class="nav-btn rewards-label " href="../rewards/"><span class="reward-float"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M8 4h8v8a4 4 0 0 1-8 0Z"/><path class="icon-stroke" d="M9 18h6M12 16v2"/><path class="icon-stroke" d="M8 7H5v2a3 3 0 0 0 3 3M16 7h3v2a3 3 0 0 1-3 3"/></svg></span><span>Rewards</span></a>
  <a class="nav-btn active" href="../favorites/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><span>Favorites</span></a>
  <a class="nav-btn " href="../account/"><svg viewBox="0 0 24 24"><circle class="icon-stroke" cx="12" cy="8" r="3.5"/><path class="icon-stroke" d="M5 20a7 7 0 0 1 14 0"/></svg><span>Account</span></a>
</nav>

<div class="toast"></div></div>
<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,el=document.getElementById("favorites");let mode="grid";
function draw(){const f=S.favorites();if(!f.length){el.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><h2>No favorites yet</h2><p>Tap the heart on a menu item to save it here.</p><a class="yellow" href="../menu/">Browse Menu</a></div>`;return}el.innerHTML=`<div class="fav-grid ${mode==="list"?"list":""}">`+f.map(x=>{const i=menu.items[x.itemId],meta=Object.values(x.customizations||{}).join(" · ");return `<article class="fav-card"><a href="../item/?id=${i.id}" style="text-decoration:none"><div class="placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div class="fav-body"><div class="fav-name">${i.name}</div><div class="fav-meta">${meta}</div><div class="fav-price">${S.fmt(i.price)}</div></div></a><button class="fav-heart" data-remove="${i.id}"><svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg></button></article>`}).join("")+"</div>";document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{S.removeFavorite(b.dataset.remove);draw()})}
document.getElementById("gridBtn").onclick=()=>{mode="grid";document.getElementById("gridBtn").classList.add("active");document.getElementById("listBtn").classList.remove("active");draw()};
document.getElementById("listBtn").onclick=()=>{mode="list";document.getElementById("listBtn").classList.add("active");document.getElementById("gridBtn").classList.remove("active");draw()};draw();
</script></body></html>
