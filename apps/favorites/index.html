<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,el=document.getElementById("favorites");let mode="grid";

function placeholder(){
  return `<svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg>`;
}

function regularFavoriteCard(item,meta,removeAttr,removeId){
  return `<article class="fav-card">
    <a href="../item/?id=${item.id}" style="text-decoration:none">
      <div class="placeholder">${placeholder()}</div>
      <div class="fav-body">
        <div class="fav-name">${item.name}</div>
        <div class="fav-meta">${meta||""}</div>
        <div class="fav-price">${S.fmt(item.price)}</div>
      </div>
    </a>
    <button class="fav-heart" ${removeAttr}="${removeId}" aria-label="Remove ${item.name} from Favorites">
      <svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg>
    </button>
  </article>`;
}

function favoriteCard(x){
  if(x.itemId){
    const item=menu.items[x.itemId];
    if(!item)return "";
    const meta=Object.values(x.customizations||{}).join(" · ");
    return regularFavoriteCard(item,meta,"data-remove-item",item.id);
  }

  if(x.addonId){
    // If this former upsell now exists as a normal Menu item (Sides/Desserts),
    // use the exact same card/list structure and make it clickable.
    const promoted=menu.items[x.addonId];
    if(promoted){
      return regularFavoriteCard(promoted,"Saved from a previous order","data-remove-addon",x.addonId);
    }

    // Non-promoted add-ons retain a correctly structured list/grid card,
    // but do not link to a nonexistent Menu Item page.
    const u=menu.upsells.find(a=>a.id===x.addonId);
    if(!u)return "";
    return `<article class="fav-card">
      <div class="fav-static">
        <div class="placeholder">${placeholder()}</div>
        <div class="fav-body">
          <div class="fav-name">${u.name}</div>
          <div class="fav-meta">Saved from a previous order</div>
          <div class="fav-price">${S.fmt(u.price)}</div>
        </div>
      </div>
      <button class="fav-heart" data-remove-addon="${u.id}" aria-label="Remove ${u.name} from Favorites">
        <svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg>
      </button>
    </article>`;
  }
  return "";
}

function removeAddonFavoriteSafe(addonId){
  if(typeof S.removeAddonFavorite==="function"){
    S.removeAddonFavorite(addonId);
    return;
  }
  const favs=(S.favorites?S.favorites():S.get("favorites",[])).filter(f=>f.addonId!==addonId);
  S.set("favorites",favs);
}

function draw(){
  const f=S.favorites();
  if(!f.length){
    el.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><h2>No favorites yet</h2><p>Tap the heart on a menu item or previous order to save it here.</p><a class="yellow" href="../menu/">Browse Menu</a></div>`;
    return;
  }

  el.innerHTML=`<div class="fav-grid ${mode==="list"?"list":""}">`+f.map(favoriteCard).join("")+"</div>";

  document.querySelectorAll("[data-remove-item]").forEach(b=>b.onclick=()=>{
    S.removeFavorite(b.dataset.removeItem);
    draw();
  });
  document.querySelectorAll("[data-remove-addon]").forEach(b=>b.onclick=()=>{
    removeAddonFavoriteSafe(b.dataset.removeAddon);
    draw();
  });
}

document.getElementById("gridBtn").onclick=()=>{
  mode="grid";
  document.getElementById("gridBtn").classList.add("active");
  document.getElementById("listBtn").classList.remove("active");
  draw();
};
document.getElementById("listBtn").onclick=()=>{
  mode="list";
  document.getElementById("listBtn").classList.add("active");
  document.getElementById("gridBtn").classList.remove("active");
  draw();
};
draw();
</script></body></html>
