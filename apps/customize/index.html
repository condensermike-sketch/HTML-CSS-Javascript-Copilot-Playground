<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Customize</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/menu-data.js"></script>
<script src="../js/app.js"></script><script>
(function (m, a, z, e) {
  var s, t, u, v;
  try {
    t = m.sessionStorage.getItem('maze-us');
  } catch (err) {}

  if (!t) {
    t = new Date().getTime();
    try {
      m.sessionStorage.setItem('maze-us', t);
    } catch (err) {}
  }

  u = document.currentScript || (function () {
    var w = document.getElementsByTagName('script');
    return w[w.length - 1];
  })();
  v = u && u.nonce;

  s = a.createElement('script');
  s.src = z + '?apiKey=' + e;
  s.async = true;
  if (v) s.setAttribute('nonce', v);
  a.getElementsByTagName('head')[0].appendChild(s);
  m.mazeUniversalSnippetApiKey = e;
})(window, document, 'https://snippet.maze.co/maze-universal-loader.js', '07cbf368-f585-4dcc-8a0b-966c9d7e76ab');
</script>
</head><body><div class="app-shell">
<div class="white-topbar"><a class="back-btn" id="back" href="../item/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m15 18-6-6 6-6"/></svg></a><div class="topbar-title" id="title"></div><div></div></div>
<main class="app-scroll customize-scroll"><div class="customize-intro">Select an option<span>(Required)</span></div><div id="choices"></div></main>
<div class="bottom-action"><button class="primary apply-btn" id="apply" disabled>Apply</button></div>
<div class="nested-sheet-wrap" id="nestedWrap"><div class="nested-sheet"><div class="sheet-handle"></div><h2 id="nestedTitle"></h2><div id="nestedOptions"></div><button class="primary" style="width:100%;margin-top:16px" id="nestedApply" disabled>Apply</button></div></div>
</div>
<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,p=new URLSearchParams(location.search);
const itemId=p.get("item")||"chickenjoy-2pc-side",type=p.get("type")||"side",edit=p.get("edit"),item=menu.items[itemId],group=menu.groups[type],draft=S.currentItemDraft(itemId);
document.getElementById("title").textContent=group.title;document.getElementById("back").href=`../item/?id=${itemId}${edit!==null?`&edit=${edit}`:""}`;
document.getElementById("choices").innerHTML=group.options.map(o=>`<label class="choice-row"><input type="radio" name="opt" value="${o.value}" ${draft.customizations[type]===o.value||draft.customizations[type]?.startsWith(o.value+" · ")?"checked":""}><div class="choice-img placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>${o.label}</strong>${o.priceDelta?`<small>+$${o.priceDelta.toFixed(2)}</small>`:""}${o.nested?`<small>Tap Apply to choose type</small>`:""}</div></label>`).join("");
let chosenNested=null;
function selected(){return document.querySelector('input[name="opt"]:checked')}

function openNested(opt){
  const ng=menu.nestedGroups[opt.nested];
  if(!ng)return;
  document.getElementById("nestedTitle").textContent=ng.title.replace("Choose a ","");
  document.getElementById("nestedOptions").innerHTML=ng.options.map(x=>`<label class="nested-option"><input type="radio" name="nested" value="${x}" ${draft.customizations[type]===x?"checked":""}><span>${x}</span></label>`).join("");
  document.getElementById("nestedWrap").classList.add("show");
  const existing=document.querySelector('input[name="nested"]:checked');
  document.getElementById("nestedApply").disabled=!existing;
  document.querySelectorAll('input[name="nested"]').forEach(n=>n.onchange=()=>document.getElementById("nestedApply").disabled=false);
}

document.querySelectorAll('input[name="opt"]').forEach(r=>r.onchange=()=>{
  const opt=group.options.find(o=>o.value===r.value);
  document.getElementById("apply").disabled=false;
  // Soda behaves as a true sub-level: selecting it immediately opens the
  // secondary Soda chooser, matching the Figma walkthrough.
  if(opt&&opt.nested) openNested(opt);
});

if(selected())document.getElementById("apply").disabled=false;

document.getElementById("apply").onclick=()=>{
  const r=selected();if(!r)return;
  const opt=group.options.find(o=>o.value===r.value);
  if(opt&&opt.nested){openNested(opt);return}
  draft.customizations[type]=r.value;
  S.saveItemDraft(itemId,draft);
  location.href=document.getElementById("back").href
};

document.getElementById("nestedApply").onclick=()=>{
  const n=document.querySelector('input[name="nested"]:checked');
  if(!n)return;
  // Store the actual selected beverage name so the Item and Cart screens
  // display "Mountain Dew", "Diet Pepsi", etc., not just "Soda".
  draft.customizations[type]=n.value;
  S.saveItemDraft(itemId,draft);
  location.href=document.getElementById("back").href
};

document.getElementById("nestedWrap").onclick=e=>{
  if(e.target.id==="nestedWrap")e.currentTarget.classList.remove("show")
};
</script></body></html>
