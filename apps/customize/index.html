<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Customize</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css?v=6">
<script src="../js/menu-data.js?v=20260815-fountain-drink"></script>
<script src="../js/app.js?v=20260814-save-intent"></script><script>
(function (m, a, z, e) {
  var s, t, u, v;
  try {
    t = m.sessionStorage.getItem('maze-us');
  } catch (err) {}

  if (!t) {
    t = new Date().getTime();
    try {
      m.sessionStorage.setItem('maze-us', t);
    } catch (err) {}
  }

  u = document.currentScript || (function () {
    var w = document.getElementsByTagName('script');
    return w[w.length - 1];
  })();
  v = u && u.nonce;

  s = a.createElement('script');
  s.src = z + '?apiKey=' + e;
  s.async = true;
  if (v) s.setAttribute('nonce', v);
  a.getElementsByTagName('head')[0].appendChild(s);

</script>
</head><body><div class="app-shell">
<div class="white-topbar"><a class="back-btn" id="back" href="../item/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m15 18-6-6 6-6"/></svg></a><div class="topbar-title" id="title"></div><div></div></div>
<main class="app-scroll customize-scroll"><div class="customize-intro" id="intro">Select an option<span>(Required)</span></div><div class="saved-banner" id="metBanner"><svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="m5 12 4 4 10-10"/></svg><span id="metText"></span></div><div id="choices"></div></main>
<div class="bottom-action"><button class="primary apply-btn" id="apply" disabled>Apply</button></div>
<div class="nested-sheet-wrap" id="nestedWrap"><div class="nested-sheet"><div class="sheet-handle"></div><h2 id="nestedTitle"></h2><div id="nestedOptions"></div><button class="primary" style="width:100%;margin-top:16px" id="nestedApply" disabled>Apply</button></div></div>
</div>
<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,p=new URLSearchParams(location.search);
const itemId=p.get("item")||"chicken-sandwich-deluxe",type=p.get("type")||"side",edit=p.get("edit"),item=menu.items[itemId],group=menu.groups[type],draft=S.currentItemDraft(itemId);
document.getElementById("title").textContent=group.title;document.getElementById("back").href=`../item/?id=${itemId}${edit!==null?`&edit=${edit}`:""}`;

if(group.quantity){
  renderQuantityGroup();
}else{
  renderSingleSelectGroup();
}

function renderQuantityGroup(){
  document.getElementById("intro").innerHTML=`Add at least 1<span>(Required)</span>`;
  const counts={...(draft.customizations[type]||{})};
  const list=document.getElementById("choices");
  list.innerHTML=group.options.map(o=>`<div class="qty-row" data-value="${o.value}">${o.image?`<div class="choice-img"><img src="../images/${o.image}" alt="${o.label}"></div>`:`<div class="choice-img placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div>`}<div><strong>${o.label}</strong><small data-meta></small></div><div><button class="menu-plus" data-add aria-label="Add ${o.label}">+</button><div class="stepper"><button data-dec aria-label="Remove one ${o.label}">−</button><span data-count>0</span><button data-inc aria-label="Add one ${o.label}">+</button></div></div></div>`).join("");

  function priceState(){
    const cups=[];
    group.options.forEach(o=>{for(let i=0;i<(counts[o.value]||0);i++)cups.push(o)});
    cups.sort((a,b)=>Number(b.priceDelta||0)-Number(a.priceDelta||0));
    return {cups, freeValue:cups.length?cups[0].value:null};
  }

  function render(){
    const {cups,freeValue}=priceState();
    group.options.forEach(o=>{
      const n=counts[o.value]||0;
      const row=list.querySelector(`[data-value="${CSS.escape(o.value)}"]`);
      row.classList.toggle("on",n>0);
      row.querySelector("[data-count]").textContent=n;
      const meta=row.querySelector("[data-meta]");
      meta.classList.remove("free");
      if(n===0){meta.textContent=""}
      else if(o.value===freeValue){
        const rest=n-1;
        meta.textContent=rest?`Included · ${rest} extra +$${(rest*Number(o.priceDelta||0)).toFixed(2)}`:"Included";
        meta.classList.add("free");
      }else{
        meta.textContent=`${n} × $${Number(o.priceDelta||0).toFixed(2)} = $${(n*Number(o.priceDelta||0)).toFixed(2)}`;
      }
    });
    const met=cups.length>0;
    document.getElementById("apply").disabled=!met;
    document.getElementById("metBanner").classList.toggle("show",met);
    document.getElementById("metText").textContent=`${cups.length} cup${cups.length===1?"":"s"} added`;
  }

  list.addEventListener("click",e=>{
    const row=e.target.closest(".qty-row");
    if(!row)return;
    const value=row.dataset.value;
    if(e.target.closest("[data-add]")||e.target.closest("[data-inc]")){
      counts[value]=(counts[value]||0)+1;
    }else if(e.target.closest("[data-dec]")){
      const next=Math.max(0,(counts[value]||0)-1);
      if(next===0)delete counts[value];else counts[value]=next;
    }else{
      return;
    }
    render();
  });

  document.getElementById("apply").onclick=()=>{
    draft.customizations[type]={...counts};
    S.saveItemDraft(itemId,draft);
    location.href=document.getElementById("back").href
  };

  render();
}

function renderSingleSelectGroup(){
  // What's stored is always the leaf choice ("Pink Lemonade"), never the
  // parent group name, so a nested option counts as selected when the stored
  // value is one of its sub-options.
  let chosen=draft.customizations[type]||null;
  const nestedOptionsOf=o=>(o.nested&&menu.nestedGroups[o.nested]&&menu.nestedGroups[o.nested].options)||[];
  const isChosen=o=>o.nested?nestedOptionsOf(o).includes(chosen):chosen===o.value;

  // Preview the sub-options by name on the parent row. Participants looking
  // for a specific flavor need to see it before they'll open the group.
  function previewText(o){
    const opts=nestedOptionsOf(o),head=opts.slice(0,3).join(", "),rest=opts.length-3;
    return rest>0?`${head} & ${rest} more`:head;
  }

  const thumb=o=>o.image?`<div class="choice-img"><img src="../images/${o.image}" alt="${o.label}"></div>`:`<div class="choice-img placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div>`;

  document.getElementById("choices").innerHTML=group.options.map(o=>o.nested
    ? `<button type="button" class="choice-row nested-row${isChosen(o)?" on":""}" data-nested="${o.value}" aria-haspopup="dialog"><span class="fake-radio" aria-hidden="true"></span>${thumb(o)}<span class="nested-copy"><strong>${o.label}</strong><small>${isChosen(o)?chosen:previewText(o)}</small></span><svg class="nested-chevron" viewBox="0 0 24 24" aria-hidden="true"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></button>`
    : `<label class="choice-row"><input type="radio" name="opt" value="${o.value}" ${isChosen(o)?"checked":""}>${thumb(o)}<div><strong>${o.label}</strong>${o.priceDelta?`<small>+$${o.priceDelta.toFixed(2)}</small>`:""}</div></label>`
  ).join("");

  function syncApply(){document.getElementById("apply").disabled=!chosen}

  function openNested(opt){
    const ng=menu.nestedGroups[opt.nested];
    if(!ng)return;
    document.getElementById("nestedTitle").textContent=ng.title;
    document.getElementById("nestedOptions").innerHTML=ng.options.map(x=>`<label class="nested-option"><input type="radio" name="nested" value="${x}" ${chosen===x?"checked":""}><span>${x}</span></label>`).join("");
    document.getElementById("nestedWrap").classList.add("show");
    document.getElementById("nestedApply").disabled=!document.querySelector('input[name="nested"]:checked');
    document.querySelectorAll('input[name="nested"]').forEach(n=>n.onchange=()=>document.getElementById("nestedApply").disabled=false);
  }

  // Tapping the parent row goes straight into the sub-list. It never selects
  // on its own, so Apply stays disabled until a real flavor is picked.
  document.querySelectorAll("[data-nested]").forEach(row=>row.onclick=()=>{
    openNested(group.options.find(o=>o.value===row.dataset.nested));
  });

  document.querySelectorAll('input[name="opt"]').forEach(r=>r.onchange=()=>{
    chosen=r.value;
    document.querySelectorAll(".nested-row").forEach(row=>{
      row.classList.remove("on");
      const opt=group.options.find(o=>o.value===row.dataset.nested);
      row.querySelector("small").textContent=previewText(opt);
    });
    syncApply();
  });

  syncApply();

  document.getElementById("apply").onclick=()=>{
    if(!chosen)return;
    draft.customizations[type]=chosen;
    S.saveItemDraft(itemId,draft);
    location.href=document.getElementById("back").href
  };

  document.getElementById("nestedApply").onclick=()=>{
    const n=document.querySelector('input[name="nested"]:checked');
    if(!n)return;
    // Store the actual selected beverage name so the Item and Cart screens
    // display "Mountain Dew", "Pink Lemonade", etc., not just the group name.
    draft.customizations[type]=n.value;
    S.saveItemDraft(itemId,draft);
    location.href=document.getElementById("back").href
  };

  document.getElementById("nestedWrap").onclick=e=>{
    if(e.target.id==="nestedWrap")e.currentTarget.classList.remove("show")
  };
}
</script></body></html>
