<section class="search-overlay" id="searchOverlay"><div class="search-header"><div class="search-box"><svg width="19" height="19" viewBox="0 0 24 24"><circle class="icon-stroke" cx="11" cy="11" r="6.5"/><path class="icon-stroke" d="m16 16 4 4"/></svg><input id="searchInput" placeholder="Search menu..."></div><button class="search-cancel" id="searchCancel">Cancel</button></div><div class="search-results"><div class="search-label">MENU ITEMS</div><div id="searchResults"></div></div></section>
<div class="toast"></div>
</div>
<script>
const menu=window.JOLLIBEE_MENU, S=window.JolliState;
const orders=[...S.sessionOrders(),...menu.seededOrders];
const HOME_ORDER_ITEM_LIMIT=2;
function orderItemLines(o){
  return (o.items||[]).map(e=>{
    if(e.itemId){const i=menu.items[e.itemId];return `${e.quantity||1}× ${i?(i.shortName||i.name):"Item"}`}
    const u=menu.upsells.find(x=>x.id===e.addonId);
    return `${e.quantity||1}× ${u?u.name:"Add-on"}`;
  });
}
function homeOrderFulfillmentLabel(o){
  return (o.fulfillment||"Previous Order").replace(/^Counter Pickup\b/,"Pick Up");
}
function homeOrderFulfillmentIcon(o){
  return /drive/i.test(o.fulfillment||"")
    ? '<path class="icon-stroke" d="M3 7h11v9H3zM14 10h4l3 3v3h-7z"/><circle class="icon-stroke" cx="7" cy="18" r="2"/><circle class="icon-stroke" cx="18" cy="18" r="2"/>'
    : '<path class="icon-stroke" d="M5.5 8h13l-1 12H6.5l-1-12Z"/><path class="icon-stroke" d="M9.5 11.5V7.5a2.5 2.5 0 0 1 5 0v4"/>';
}
function orderTotal(o){
  return (o.items||[]).reduce((n,e)=>{
    if(e.itemId)return n+S.configuredItemUnitPrice(e.itemId,e.customizations||{})*(e.quantity||1);
    const u=menu.upsells.find(x=>x.id===e.addonId);
    return n+(u?u.price:0)*(e.quantity||1);
  },0);
}
function drawHomeOrderAgain(){
  const recent=orders.slice(0,2);
  const track=document.getElementById("homeOrderAgain");
  track.innerHTML=recent.map((o,idx)=>{
    const lines=orderItemLines(o);
    const hidden=lines.length-HOME_ORDER_ITEM_LIMIT;
    const itemsHtml=lines.slice(0,HOME_ORDER_ITEM_LIMIT).map(l=>`<div class="home-order-line">${l}</div>`).join("")
      +(hidden>0?`<div class="home-order-line home-order-line-more">+${hidden} more items</div>`:"");
    return `<article class="home-order-card" role="link" tabindex="0" aria-label="View order details">
    <svg class="home-order-card-chevron" width="18" height="18" viewBox="0 0 24 24"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg>
    <div class="home-order-card-items">${itemsHtml}</div>
    <div class="home-order-card-meta">
      <svg class="home-order-meta-icon" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">${homeOrderFulfillmentIcon(o)}</svg>
      <span>${homeOrderFulfillmentLabel(o)}${o.dateLabel?` · ${o.dateLabel}`:""}</span>
    </div>
    <div class="home-order-card-foot"><span class="home-order-card-total">${S.fmt(orderTotal(o))}</span><button class="home-order-reorder" data-home-reorder="${idx}">Reorder</button></div>
  </article>`;
  }).join("");
  track.scrollLeft=0;
  document.querySelectorAll("[data-home-reorder]").forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const o=recent[Number(b.dataset.homeReorder)];
    S.setCart((o.items||[]).map(x=>JSON.parse(JSON.stringify(x))));
    location.href="./cart/";
  });
  document.querySelectorAll(".home-order-card").forEach(card=>{
    card.onclick=()=>{location.href="./order-again/"};
    card.onkeydown=(e)=>{
      if(e.key==="Enter"||e.key===" "){e.preventDefault();location.href="./order-again/"}
    };
  });
}
drawHomeOrderAgain();
const categoryImages={nuggets:"category-nuggets.jpg","limited-time":"category-limited-time-offer.png",chickenjoy:"category-chickenjoy.jpg",sandwiches:"category-sandwiches.png","meal-deals":"chicken-sandwich-and-pie-meal-deal.png","perfect-pairs":"1pc-chickenjoy-jolly-spaghetti-and-drink.png",family:"category-family-meals.jpg",tenders:"category-tenders.png",burgers:"category-burgers.png",spaghetti:"category-spaghetti.jpg",palabok:"category-palabok-fiesta.png","burger-steak":"category-burger-steak.jpg",sides:"category-sides.png",drinks:"category-drinks.jpg",desserts:"category-desserts.jpg"};
document.getElementById("homeCategories").innerHTML=menu.categories.map(c=>{const img=categoryImages[c.id];const thumb=img?`<div class="category-image"><img src="./images/${img}" alt="${c.label}"></div>`:`<div class="category-image placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div>`;return `<a class="category-card" href="./menu/#${c.id}">${thumb}<div class="category-label">${c.label}</div></a>`}).join("");
const overlay=document.getElementById("searchOverlay"),input=document.getElementById("searchInput"),results=document.getElementById("searchResults");
function drawSearch(q=""){
  q=q.trim().toLowerCase();
  const list=Object.values(menu.items).filter(i=>!q||i.name.toLowerCase().includes(q));
  results.innerHTML=list.length?list.map(i=>{
    const thumb=i.image?`<div class="search-thumb"><img src="./images/${i.image}" alt="${i.name}"></div>`:`<div class="search-thumb placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div>`;
    return `<a class="search-row" href="./item/?id=${i.id}">${thumb}<div class="search-name">${i.name}</div><div class="search-price">$${i.price.toFixed(2)}</div></a>`;
  }).join(""):`<div class="menu-coming">No matching items</div>`;
}
drawSearch();
document.getElementById("searchBtn").onclick=()=>{drawSearch(input.value);overlay.classList.add("show");setTimeout(()=>input.focus(),50)};
document.getElementById("searchCancel").onclick=()=>{overlay.classList.remove("show");input.value="";drawSearch()};
input.oninput=()=>drawSearch(input.value);
(function(){
const track=document.getElementById("promoTrack"),slides=track.children.length;
const firstClone=track.children[0].cloneNode(true);
firstClone.setAttribute("aria-hidden","true");
track.appendChild(firstClone);
const slidesEls=[...track.children];
const START=1;
let idx=START,playing=true,timer,resetPending=false,resetTimer;
function center(i){const el=slidesEls[Math.max(0,Math.min(i,slidesEls.length-1))];return el.offsetLeft-(track.clientWidth-el.offsetWidth)/2}
function nearest(){
  const mid=track.scrollLeft+track.clientWidth/2;
  let best=0,bestDist=Infinity;
  slidesEls.forEach((el,i)=>{
    const d=Math.abs(el.offsetLeft+el.offsetWidth/2-mid);
    if(d<bestDist){bestDist=d;best=i}
  });
  return best;
}
const dots=document.getElementById("promoDots");
dots.innerHTML=Array.from({length:slides},()=>'<span class="promo-dot"></span>').join("");
function syncDots(){[...dots.children].forEach((d,i)=>d.classList.toggle("on",i===idx%slides))}
function finishReset(){
  if(!resetPending)return;
  resetPending=false;clearTimeout(resetTimer);
  idx=0;track.scrollTo({left:center(0),behavior:"auto"});
  syncDots();
}
function advance(){
  if(idx>=slides)finishReset();
  idx++;
  track.scrollTo({left:center(idx),behavior:"smooth"});
  if(idx===slides){resetPending=true;clearTimeout(resetTimer);resetTimer=setTimeout(finishReset,900)}
  syncDots();
}
function prev(){
  if(idx>=slides)finishReset();
  idx=(idx-1+slides)%slides;
  track.scrollTo({left:center(idx),behavior:"smooth"});
  syncDots();
}
track.addEventListener("scrollend",()=>{
  if(resetPending){finishReset();return}
  idx=nearest();
  syncDots();
});
function start(){clearInterval(timer);timer=setInterval(advance,4000)}
function stop(){clearInterval(timer)}
function nudge(fn){fn();if(playing)start()}
document.getElementById("promoPrev").onclick=()=>{nudge(prev)};
document.getElementById("promoNext").onclick=()=>{nudge(advance)};
const pauseBtn=document.getElementById("promoPause");
const PAUSE_GLYPH='<svg viewBox="0 0 24 24"><path class="icon-fill" d="M9 5.5h2.6v13H9zM12.9 5.5h2.6v13h-2.6z"/></svg>';
const PLAY_GLYPH='<svg viewBox="0 0 24 24"><path class="icon-fill" d="M8.5 5.5 18 12l-9.5 6.5z"/></svg>';
pauseBtn.onclick=()=>{
  playing=!playing;
  pauseBtn.innerHTML=playing?PAUSE_GLYPH:PLAY_GLYPH;
  pauseBtn.setAttribute("aria-label",playing?"Pause carousel":"Play carousel");
  playing?start():stop();
};
function jumpToStart(){track.scrollTo({left:center(idx),behavior:"auto"})}
jumpToStart();
requestAnimationFrame(jumpToStart);
syncDots();
start();
})();
</script></body></html>
