<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Side</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<style>
:root{
  --red:#df0038;--yellow:#f7b500;--ink:#111;--text:#5f5f5f;--muted:#8d8d8d;
  --line:#dedede;--tile:#dedede;--soft:#f6f6f6;--font:"Nunito",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);font-optical-sizing:auto;background:#333;color:var(--ink)}
button,input{font:inherit}.phone{width:min(100vw,440px);height:100dvh;min-height:700px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
svg{display:block}.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar{height:78px;padding:calc(16px + env(safe-area-inset-top)) 17px 10px;display:grid;grid-template-columns:40px 1fr 40px;align-items:end;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:20}
.topbar.no-line{border-bottom:0}.back,.heart,.plain{border:0;background:transparent;padding:0;color:#333;display:grid;place-items:center;width:34px;height:34px}
.back svg,.heart svg{width:25px;height:25px}.top-title{text-align:center;font-size:16px;font-weight:900;align-self:center}
.scroll{position:absolute;top:78px;bottom:79px;left:0;right:0;overflow:auto;scrollbar-width:none;background:#fff}.scroll::-webkit-scrollbar{display:none}
.bottom-action{position:absolute;left:0;right:0;bottom:0;min-height:79px;background:#fff;border-top:1px solid var(--line);padding:10px 17px calc(10px + env(safe-area-inset-bottom));z-index:30}
.placeholder{background:var(--tile);color:#aaa;display:grid;place-items:center}.placeholder svg{width:25px;height:25px}
.primary{border:0;background:var(--red);color:#fff;border-radius:999px;height:48px;font-weight:900;font-size:16px}
.primary:disabled{background:#cfcfcf}.yellow{border:0;background:var(--yellow);color:#171717;border-radius:999px;height:44px;padding:0 19px;font-size:15px;font-weight:900}
.secondary{border:1px solid #d0d0d0;background:#fff;border-radius:999px;height:48px;font-size:15px;color:#444}
@media(min-width:500px){body{min-height:100vh;display:grid;place-items:center;padding:20px}.phone{width:440px;height:956px;min-height:956px;border-radius:36px;box-shadow:0 8px 28px rgba(0,0,0,.4)}}
</style>

<style>
.choice-scroll{position:absolute;top:78px;bottom:79px;left:0;right:0;overflow:auto}.intro{padding:18px 17px 10px;font-size:16px;color:#333}.intro span{display:block;color:#888;font-size:14px;margin-top:2px}.choice{min-height:91px;display:grid;grid-template-columns:34px 55px 1fr;gap:10px;align-items:center;padding:10px 17px;border-bottom:1px solid var(--line)}.choice input{width:22px;height:22px;accent-color:var(--red)}.cimg{width:55px;height:55px;border-radius:8px}.choice strong{font-size:18px;line-height:1.15}.choice small{display:block;font-size:14px;color:#888;margin-top:3px}.apply{width:100%}
</style></head><body><div class="phone"><div class="topbar"><a class="back" href="../item/"><svg viewBox="0 0 24 24"><path class="stroke" d="m15 18-6-6 6-6"/></svg></a><div class="top-title">Side</div><div></div></div>
<main class="choice-scroll"><div class="intro">Select an option<span>(Required)</span></div><label class="choice"><input type="radio" name="opt" value="Jolly Crispy Fries Regular"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>Jolly Crispy Fries Regular</strong></div></label><label class="choice"><input type="radio" name="opt" value="Mashed Potato Regular"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>Mashed Potato Regular</strong></div></label><label class="choice"><input type="radio" name="opt" value="Steamed Rice"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>Steamed Rice</strong></div></label><label class="choice"><input type="radio" name="opt" value="2 pc Biscuit"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>2 pc Biscuit</strong></div></label><label class="choice"><input type="radio" name="opt" value="Adobo Rice"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>Adobo Rice</strong><small>+$1.50</small></div></label><label class="choice"><input type="radio" name="opt" value="Side of Jolly Spaghetti"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>Side of Jolly Spaghetti</strong></div></label><label class="choice"><input type="radio" name="opt" value="Coleslaw"><div class="cimg placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><strong>Coleslaw</strong></div></label></main>
<div class="bottom-action"><button class="primary apply" id="apply" disabled>Apply</button></div></div>
<script>
const saved=sessionStorage.getItem("side")||localStorage.getItem("savedSide")||"";document.querySelectorAll('input[name="opt"]').forEach(r=>{if(r.value===saved)r.checked=true;r.addEventListener("change",()=>document.getElementById("apply").disabled=false)});if(saved)document.getElementById("apply").disabled=false;
document.getElementById("apply").onclick=()=>{const r=document.querySelector('input[name="opt"]:checked');if(!r)return;sessionStorage.setItem("side",r.value);location.href="../item/"};
</script></body></html>
