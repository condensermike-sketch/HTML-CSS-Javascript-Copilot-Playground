<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Loading prototype…</title>
</head>
<body>
<script>
(function(){
  var path = location.pathname + location.search + location.hash;
  sessionStorage.setItem("spa_redirect", path);

  var parts = location.pathname.split("/").filter(Boolean);
  var base = "";

  if(location.hostname.endsWith(".github.io") && parts.length){
    base = "/" + parts[0] + "/";
  } else {
    base = "/";
  }

  location.replace(location.origin + base);
})();
</script>
</body>
</html>
