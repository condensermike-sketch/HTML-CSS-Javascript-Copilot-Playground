<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jollibee Menu Prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

<style>
:root{
  --red:#df0038;
  --ink:#151515;
  --muted:#7e7e7e;
  --line:#e4e4e4;
  --tile:#dedede;
  --font:"Nunito",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font);font-optical-sizing:auto;background:#333;color:var(--ink)}
button{font:inherit;cursor:pointer}
.phone{
  width:min(100vw,440px);
  height:100dvh;
  min-height:700px;
  margin:0 auto;
  background:#fff;
  position:relative;
  overflow:hidden;
}
.header{
  position:absolute;left:0;right:0;top:0;z-index:30;
  height:116px;
  background:var(--red);
  color:white;
  padding:calc(18px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:flex-end;
}
.header-row{width:100%;display:grid;grid-template-columns:36px 1fr 82px;align-items:center}
.back,.head-icon{
  border:0;background:transparent;color:white;padding:0;display:grid;place-items:center
}
.back{width:32px;height:38px}
.head-actions{display:flex;justify-content:flex-end;gap:10px}
.head-icon{width:34px;height:34px}
svg{display:block}
.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.location small{display:block;font-size:11px;font-weight:400;line-height:1}
.location strong{font-size:16px;font-weight:900;display:flex;align-items:center;gap:4px;margin-top:4px;line-height:1}
.location svg{width:13px;height:13px}

.tabs{
  position:absolute;left:0;right:0;top:116px;z-index:28;
  height:47px;background:#fff;border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;white-space:nowrap;
}
.tabs::-webkit-scrollbar{display:none}
.tabs-inner{display:inline-flex;min-width:max-content;height:100%;align-items:stretch;padding:0 18px}
.tab{
  position:relative;
  border:0;background:#fff;color:#777;
  padding:0 14px;
  font-size:14px;font-weight:400;
  white-space:nowrap;
}
.tab:first-child{padding-left:0;margin-right:14px}
.tab.active{color:var(--red);font-weight:900}
.tab.active::after{
  content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--red)
}
.tab:first-child.active::after{left:0}

.menu-scroll{
  position:absolute;left:0;right:0;top:163px;bottom:78px;
  overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none;background:#fff;
}
.menu-scroll::-webkit-scrollbar{display:none}
.section{scroll-margin-top:8px}
.section h2{
  margin:0;padding:18px 17px 10px;
  font-size:20px;line-height:1.1;font-weight:900;
}
.coming{
  padding:4px 17px 28px;
  color:#b2b2b2;font-size:14px;font-weight:400;
}
.product{
  min-height:141px;
  display:grid;
  grid-template-columns:74px 1fr 42px;
  gap:12px;
  align-items:start;
  padding:12px 17px 14px;
  border-bottom:1px solid var(--line);
}
.thumb{
  width:72px;height:72px;border-radius:8px;background:var(--tile);color:#aaa;
  display:grid;place-items:center;
}
.thumb svg{width:24px;height:24px}
.product-info{min-width:0}
.product-name{
  font-size:16px;font-weight:900;line-height:1.18;margin:0 0 4px;
}
.product-desc{
  font-size:13px;font-weight:400;line-height:1.3;color:#8a8a8a;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.price{
  margin-top:7px;font-size:15px;font-weight:900;
}
.plus{
  align-self:center;justify-self:end;
  width:37px;height:37px;border-radius:50%;
  border:0;background:var(--red);color:white;font-size:24px;font-weight:300;line-height:1;
  display:grid;place-items:center;
}
.bottom-nav{
  position:absolute;left:0;right:0;bottom:0;z-index:35;
  height:78px;background:#fff;border-top:1px solid #d8d8d8;
  display:grid;grid-template-columns:repeat(5,1fr);
  padding:8px 9px calc(6px + env(safe-area-inset-bottom));
}
.nav-btn{
  position:relative;border:0;background:transparent;color:#aaa;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;line-height:1;font-weight:900;
}
.nav-btn svg{width:23px;height:23px}
.nav-btn.active{color:var(--red)}
.reward-float{
  position:absolute;top:-20px;width:49px;height:49px;border-radius:50%;
  background:white;border:1px solid #d8d8d8;box-shadow:0 2px 6px rgba(0,0,0,.12);
  display:grid;place-items:center;
}
.reward-float svg{width:24px;height:24px}
.rewards-label{padding-top:28px}
.toast{
  position:absolute;left:50%;bottom:92px;transform:translateX(-50%);
  background:#222;color:white;border-radius:999px;padding:9px 14px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s;z-index:80;white-space:nowrap
}
.toast.show{opacity:1}

@media(min-width:500px){
  body{min-height:100vh;display:grid;place-items:center;padding:20px}
  .phone{width:440px;height:956px;min-height:956px;border-radius:36px;box-shadow:0 8px 28px rgba(0,0,0,.4)}
}
</style>
</head>
<body>
<div class="phone">

<header class="header">
  <div class="header-row">
    <button class="back" aria-label="Back">
      <svg width="25" height="25" viewBox="0 0 24 24"><path class="stroke" d="m15 18-6-6 6-6"/></svg>
    </button>

    <div class="location">
      <small>Pick up from</small>
      <strong>Beverly
        <svg viewBox="0 0 24 24"><path class="stroke" d="m7 9 5 5 5-5"/></svg>
      </strong>
    </div>

    <div class="head-actions">
      <button class="head-icon" aria-label="Search">
        <svg width="23" height="23" viewBox="0 0 24 24">
          <circle class="stroke" cx="11" cy="11" r="6.5"/>
          <path class="stroke" d="m16 16 4 4"/>
        </svg>
      </button>
      <button class="head-icon" aria-label="Notifications">
        <svg width="23" height="23" viewBox="0 0 24 24">
          <path class="stroke" d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path class="stroke" d="M10 21h4"/>
        </svg>
      </button>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs">
  <div class="tabs-inner" id="tabsInner"></div>
</nav>

<main class="menu-scroll" id="menuScroll"></main>

<nav class="bottom-nav">
  <button class="nav-btn">
    <svg viewBox="0 0 24 24"><path class="stroke" d="m4 10 8-6 8 6v10H4Z"/><path class="stroke" d="M9 20v-6h6v6"/></svg>
    <span>Home</span>
  </button>
  <button class="nav-btn active">
    <svg viewBox="0 0 24 24"><path class="stroke" d="M4 7h16M4 12h16M4 17h16"/></svg>
    <span>Menu</span>
  </button>
  <button class="nav-btn rewards-label">
    <span class="reward-float">
      <svg viewBox="0 0 24 24"><path class="stroke" d="M8 4h8v8a4 4 0 0 1-8 0Z"/><path class="stroke" d="M9 18h6M12 16v2"/><path class="stroke" d="M8 7H5v2a3 3 0 0 0 3 3M16 7h3v2a3 3 0 0 1-3 3"/></svg>
    </span>
    <span>Rewards</span>
  </button>
  <button class="nav-btn">
    <svg viewBox="0 0 24 24"><path class="stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg>
    <span>Favorites</span>
  </button>
  <button class="nav-btn">
    <svg viewBox="0 0 24 24"><circle class="stroke" cx="12" cy="8" r="3.5"/><path class="stroke" d="M5 20a7 7 0 0 1 14 0"/></svg>
    <span>Account</span>
  </button>
</nav>

<div class="toast" id="toast">Added to cart</div>

</div>

<script>
const categories = [
  {
    id:"chickenjoy",
    label:"Chickenjoy Fried Chicken",
    products:[
      {name:"2pc Chickenjoy w/Biscuit + 1 Side", desc:"Two pieces of Chickenjoy served with a buttermilk biscuit and your choice of side.", price:"$8.99"},
      {name:"2pc Chickenjoy w/Biscuit + 1 Side and Drink", desc:"Two pieces of Chickenjoy with a biscuit, your choice of side and a drink.", price:"$11.49"}
    ]
  },
  {id:"sandwiches", label:"Chicken Sandwiches", coming:true},
  {
    id:"meal-deals",
    label:"Meal Deals",
    products:[
      {name:"2pc Chickenjoy Meal Deal", desc:"2pc of crispy, juicy Chickenjoy fried chicken with your choice of side.", price:"$12.00"}
    ]
  },
  {
    id:"perfect-pairs",
    label:"Perfect Pairs",
    products:[
      {name:"1pc Chickenjoy w/Jolly Spaghetti", desc:"Savoury Chickenjoy fried chicken paired with our signature Jolly Spaghetti.", price:"$10.99"},
      {name:"1pc Chickenjoy w/Jolly Spaghetti and Drink", desc:"Chickenjoy + spaghetti + your choice of drink.", price:"$13.49"},
      {name:"2pc Chickenjoy w/Jolly Spaghetti", desc:"Two pieces of Chickenjoy with a serving of Jolly Spaghetti.", price:"$11.99"},
      {name:"2pc Chickenjoy w/Jolly Spaghetti and Drink", desc:"Two pieces of Chickenjoy with Jolly Spaghetti and your choice of drink.", price:"$14.49"}
    ]
  },
  {
    id:"family-meals",
    label:"Family Meals",
    products:[
      {name:"8pc Chickenjoy Family Bucket", desc:"Feed the whole family with 8 pieces of our signature Chickenjoy.", price:"$26.99"}
    ]
  },
  {id:"tenders", label:"Chicken Tenders", coming:true},
  {id:"burgers", label:"Burgers", coming:true},
  {
    id:"spaghetti",
    label:"Jolly Spaghetti",
    products:[
      {name:"Jolly Spaghetti Solo", desc:"Jollibee's signature sweet-style spaghetti topped with our savory sauce.", price:"$6.99"}
    ]
  },
  {id:"palabok", label:"Palabok Fiesta", coming:true},
  {id:"burger-steak", label:"Burger Steak", coming:true},
  {id:"sides", label:"Sides", coming:true},
  {id:"drinks", label:"Drinks", coming:true},
  {id:"desserts", label:"Desserts", coming:true}
];

const placeholder = `
<svg viewBox="0 0 24 24" aria-hidden="true">
  <rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/>
  <circle class="stroke" cx="9" cy="9" r="2"/>
  <path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/>
</svg>`;

const tabsInner = document.getElementById("tabsInner");
const menuScroll = document.getElementById("menuScroll");
const toast = document.getElementById("toast");

tabsInner.innerHTML = categories.map((c,i)=>
  `<button class="tab ${i===0?"active":""}" data-id="${c.id}">${c.label}</button>`
).join("");

menuScroll.innerHTML = categories.map(c=>`
  <section class="section" id="${c.id}" data-id="${c.id}">
    <h2>${c.label}</h2>
    ${
      c.coming
      ? `<div class="coming">Coming soon</div>`
      : c.products.map(p=>`
        <article class="product">
          <div class="thumb">${placeholder}</div>
          <div class="product-info">
            <div class="product-name">${p.name}</div>
            <div class="product-desc">${p.desc}</div>
            <div class="price">${p.price}</div>
          </div>
          <button class="plus" aria-label="Add ${p.name}">+</button>
        </article>
      `).join("")
    }
  </section>
`).join("");

let programmaticScroll = false;
let scrollTimer = null;

function setActive(id, center=true){
  document.querySelectorAll(".tab").forEach(t=>{
    const active = t.dataset.id === id;
    t.classList.toggle("active",active);
    if(active && center){
      t.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"});
    }
  });
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.addEventListener("click",()=>{
    const target=document.getElementById(tab.dataset.id);
    if(!target)return;
    programmaticScroll=true;
    setActive(tab.dataset.id);
    menuScroll.scrollTo({top:target.offsetTop-2,behavior:"smooth"});
    clearTimeout(scrollTimer);
    scrollTimer=setTimeout(()=>programmaticScroll=false,700);
  });
});

function updateActiveFromScroll(){
  if(programmaticScroll)return;
  const sections=[...document.querySelectorAll(".section")];
  const y=menuScroll.scrollTop + 30;
  let current=sections[0].dataset.id;
  for(const s of sections){
    if(s.offsetTop <= y) current=s.dataset.id;
    else break;
  }
  setActive(current);
}

menuScroll.addEventListener("scroll",()=>{
  window.requestAnimationFrame(updateActiveFromScroll);
});

document.querySelectorAll(".plus").forEach(btn=>{
  btn.addEventListener("click",()=>{
    toast.classList.add("show");
    setTimeout(()=>toast.classList.remove("show"),1200);
  });
});

document.querySelector(".back").addEventListener("click",()=>history.back());
</script>
</body>
</html>
