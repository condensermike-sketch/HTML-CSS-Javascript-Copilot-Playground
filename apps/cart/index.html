<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Cart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<style>
:root{
  --red:#df0038;--yellow:#f7b500;--ink:#111;--text:#5f5f5f;--muted:#8d8d8d;
  --line:#dedede;--tile:#dedede;--soft:#f6f6f6;--font:"Nunito",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--font);font-optical-sizing:auto;background:#333;color:var(--ink)}
button,input{font:inherit}.phone{width:min(100vw,440px);height:100dvh;min-height:700px;margin:0 auto;background:#fff;position:relative;overflow:hidden}
svg{display:block}.stroke{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar{height:78px;padding:calc(16px + env(safe-area-inset-top)) 17px 10px;display:grid;grid-template-columns:40px 1fr 40px;align-items:end;border-bottom:1px solid var(--line);background:#fff;position:relative;z-index:20}
.topbar.no-line{border-bottom:0}.back,.heart,.plain{border:0;background:transparent;padding:0;color:#333;display:grid;place-items:center;width:34px;height:34px}
.back svg,.heart svg{width:25px;height:25px}.top-title{text-align:center;font-size:16px;font-weight:900;align-self:center}
.scroll{position:absolute;top:78px;bottom:79px;left:0;right:0;overflow:auto;scrollbar-width:none;background:#fff}.scroll::-webkit-scrollbar{display:none}
.bottom-action{position:absolute;left:0;right:0;bottom:0;min-height:79px;background:#fff;border-top:1px solid var(--line);padding:10px 17px calc(10px + env(safe-area-inset-bottom));z-index:30}
.placeholder{background:var(--tile);color:#aaa;display:grid;place-items:center}.placeholder svg{width:25px;height:25px}
.primary{border:0;background:var(--red);color:#fff;border-radius:999px;height:48px;font-weight:900;font-size:16px}
.primary:disabled{background:#cfcfcf}.yellow{border:0;background:var(--yellow);color:#171717;border-radius:999px;height:44px;padding:0 19px;font-size:15px;font-weight:900}
.secondary{border:1px solid #d0d0d0;background:#fff;border-radius:999px;height:48px;font-size:15px;color:#444}
@media(min-width:500px){body{min-height:100vh;display:grid;place-items:center;padding:20px}.phone{width:440px;height:956px;min-height:956px;border-radius:36px;box-shadow:0 8px 28px rgba(0,0,0,.4)}}
</style>

<style>
.cart-scroll{position:absolute;top:78px;bottom:79px;left:0;right:0;overflow:auto}.pickup{padding:8px 17px 13px;border-bottom:10px solid #f4f4f4}.loc{display:grid;grid-template-columns:22px 1fr;gap:10px}.loc small{color:#999;font-size:14px}.loc strong{display:block;font-size:18px;margin:2px 0}.loc p{margin:0;color:#777;font-size:16px;line-height:1.4}.loc a{color:var(--red);font-weight:900;text-decoration:none}
.fulfill{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.fulfill button{height:46px;border-radius:999px;border:1px solid #cfcfcf;background:#fff;font-weight:900}.fulfill .active{background:var(--red);color:#fff;border-color:var(--red)}.customer{display:grid;grid-template-columns:22px 1fr 20px;gap:10px;align-items:center;padding:11px 0 0;border-top:1px solid var(--line);margin-top:9px}.customer strong{font-size:18px}.customer span{display:block;color:#777;font-size:16px}
.order{padding:17px}.order h2{font-size:20px;margin:0 0 4px}.count{font-size:14px;color:#aaa;margin-bottom:15px}.item{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.item .placeholder{width:72px;height:72px;border-radius:8px}.iname{font-size:16px;font-weight:900;line-height:1.2}.meta{font-size:14px;color:#999;margin-top:3px}.iprice{font-size:17px;font-weight:900;margin-top:6px}.addon{font-size:14px;padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.summary{padding-top:10px}.sline{display:flex;justify-content:space-between;font-size:15px;margin:8px 0}.sline.total{font-size:17px;font-weight:900;border-top:1px solid var(--line);padding-top:8px}.place{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0 18px}.badge{background:#fff;color:var(--red);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px}
</style></head><body><div class="phone"><div class="topbar"><a class="back" href="../item/"><svg viewBox="0 0 24 24"><path class="stroke" d="m15 18-6-6 6-6"/></svg></a><div class="top-title">My Cart</div><div></div></div>
<main class="cart-scroll"><section class="pickup"><div class="loc"><svg width="20" height="20" viewBox="0 0 24 24"><path class="stroke" d="m4 10 8-6 8 6v10H4Z"/></svg><div><small>Pick up at:</small><strong>Beverly</strong><p>3821 Beverly Blvd, Los Angeles, CA 90004<br>1891.84 miles away · <a href="#">View Store Details</a></p></div></div><div class="fulfill"><button class="active">♙ &nbsp; Counter</button><button>▣ &nbsp; Drive-Thru</button></div><div class="customer"><svg width="20" height="20" viewBox="0 0 24 24"><path class="stroke" d="M6 3h4l2 5-3 2a16 16 0 0 0 5 5l2-3 5 2v4c0 1-1 2-2 2C10 20 4 14 4 5c0-1 1-2 2-2Z"/></svg><div><strong>Username</strong><span>(859) 559-1945</span></div><span>›</span></div></section>
<section class="order"><h2>My Order</h2><div class="count" id="count"></div><div class="item"><div class="placeholder"><svg viewBox="0 0 24 24"><rect class="stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="stroke" cx="9" cy="9" r="2"/><path class="stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><div class="iname">2pc Chickenjoy w/ Biscuit + 1 Side</div><div class="meta" id="customMeta"></div><div class="iprice">$8.99</div></div></div><div id="addons"></div><div class="summary"><div class="sline"><span>Subtotal</span><span id="subtotal"></span></div><div class="sline"><span>Tax (9.75%)</span><span id="tax"></span></div><div class="sline total"><span>Order Total</span><span id="total"></span></div></div></section></main>
<div class="bottom-action"><button class="primary place"><span style="display:flex;align-items:center;gap:10px"><span class="badge" id="badge">1</span>Place Order</span><span id="bottomTotal"></span></button></div></div>
<script>
const qty=Number(sessionStorage.getItem("cartQty")||1),ch=sessionStorage.getItem("chicken")||localStorage.getItem("savedChicken")||"Original",sd=sessionStorage.getItem("side")||localStorage.getItem("savedSide")||"Jolly Crispy Fries Regular",adds=JSON.parse(sessionStorage.getItem("addons")||"[]");
const prices={"Peach Mango Pie":2.99,"Steamed Rice":2.99,"Mango Freeze":5.29,"6pc Pie Snack Pack":16.00};let sub=8.99*qty+adds.reduce((s,a)=>s+(prices[a]||0),0),tax=sub*.0975,total=sub+tax;
document.getElementById("count").textContent=`${qty+adds.length} item${qty+adds.length===1?"":"s"} in cart`;document.getElementById("customMeta").textContent=`${ch} · ${sd}`;document.getElementById("addons").innerHTML=adds.map(a=>`<div class="addon"><span>${a}</span><strong>$${(prices[a]||0).toFixed(2)}</strong></div>`).join("");document.getElementById("subtotal").textContent="$"+sub.toFixed(2);document.getElementById("tax").textContent="$"+tax.toFixed(2);document.getElementById("total").textContent="$"+total.toFixed(2);document.getElementById("bottomTotal").textContent="$"+total.toFixed(2);document.getElementById("badge").textContent=qty+adds.length;
</script></body></html>
