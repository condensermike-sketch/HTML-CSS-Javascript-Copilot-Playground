<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>My Cart</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
<script src="../js/menu-data.js"></script>
<script src="../js/app.js"></script></head><body><div class="app-shell">
<div class="white-topbar"><a class="back-btn" href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m15 18-6-6 6-6"/></svg></a><div class="topbar-title">My Cart</div><div></div></div>
<main class="app-scroll cart-scroll"><section class="cart-pickup"><div class="cart-location"><svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="m4 10 8-6 8 6v10H4Z"/></svg><div><small>Pick up at:</small><strong>Beverly</strong><p>3821 Beverly Blvd, Los Angeles, CA 90004<br>Counter or Drive-Thru pickup</p></div></div><div class="fulfill"><button class="active">Counter</button><button>Drive-Thru</button></div></section><section class="cart-order" id="cartOrder"></section></main>
<div class="bottom-action" id="placeWrap"><button class="primary place-order" id="placeOrder"><span style="display:flex;align-items:center;gap:10px"><span class="place-badge" id="placeBadge"></span>Place Order</span><span id="placeTotal"></span></button></div>
<div class="toast"></div></div>
<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,wrap=document.getElementById("cartOrder");
function priceOf(entry){if(entry.itemId)return menu.items[entry.itemId].price*(entry.quantity||1);const u=menu.upsells.find(x=>x.id===entry.addonId);return u?(u.price*(entry.quantity||1)):0}
function draw(){
  const cart=S.cart();
  if(!cart.length){wrap.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M3 4h2l2.5 11h10l2-7H6"/><circle class="icon-stroke" cx="9" cy="20" r="1"/><circle class="icon-stroke" cx="18" cy="20" r="1"/></svg><h2>Your cart is empty</h2><p>Add something delicious from the menu.</p><a class="yellow" href="../menu/">Browse Menu</a></div>`;document.getElementById("placeWrap").style.display="none";return}
  document.getElementById("placeWrap").style.display="block";
  const sub=cart.reduce((n,e)=>n+priceOf(e),0),tax=sub*.0975,total=sub+tax;
  wrap.innerHTML=`<h2>My Order</h2><div class="cart-count">${S.cartCount()} item${S.cartCount()===1?"":"s"} in cart</div>`+cart.map((e,i)=>{if(e.itemId){const it=menu.items[e.itemId],meta=Object.values(e.customizations||{}).join(" · ");return `<article class="cart-item" data-index="${i}"><div class="cart-item-img placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><div class="cart-item-name">${it.name}</div><div class="cart-meta">${meta}</div><div class="cart-item-price">${S.fmt(priceOf(e))}</div><div class="cart-actions"><a class="cart-link" href="../item/?id=${it.id}&edit=${i}">Edit</a></div></div><button class="delete-btn" data-delete="${i}" aria-label="Delete"><svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button></article>`}const u=menu.upsells.find(x=>x.id===e.addonId);return `<article class="cart-item" data-index="${i}"><div class="cart-item-img placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><div class="cart-item-name">${u.name}</div><div class="cart-item-price">${S.fmt(priceOf(e))}</div></div><button class="delete-btn" data-delete="${i}"><svg width="20" height="20" viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"/></svg></button></article>`}).join("")+`<div class="cart-summary"><div class="summary-line"><span>Subtotal</span><span>${S.fmt(sub)}</span></div><div class="summary-line"><span>Tax (9.75%)</span><span>${S.fmt(tax)}</span></div><div class="summary-line total"><span>Order Total</span><span>${S.fmt(total)}</span></div></div>`;
  document.getElementById("placeBadge").textContent=S.cartCount();document.getElementById("placeTotal").textContent=S.fmt(total);
  document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const idx=Number(b.dataset.delete),row=b.closest(".cart-item");b.innerHTML='<span class="spinner"></span>';setTimeout(()=>{S.removeCartItem(idx);draw()},550)})
}
draw();
document.querySelectorAll(".fulfill button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".fulfill button").forEach(x=>x.classList.remove("active"));b.classList.add("active")});
document.getElementById("placeOrder").onclick=()=>{const cart=S.cart();if(!cart.length)return;S.addCompletedOrder({id:"user-"+Date.now(),dateLabel:"Today",fulfillment:"Counter Pickup · Beverly",items:cart});S.clearCart();location.href="../?ordered=1"};
</script></body></html>
