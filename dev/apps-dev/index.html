<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9163d"><title>Jollibee Home</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css?v=3">
<script src="./js/menu-data.js"></script>
<script src="./js/app.js"></script></head>
<body><div class="app-shell">
<header class="top-red"><div class="top-red-row"><div class="pickup"><small>Pick up from</small><strong>Beverly <svg width="14" height="14" viewBox="0 0 24 24"><path class="icon-stroke" d="m7 9 5 5 5-5"/></svg></strong></div><div class="header-actions">
<button class="icon-btn" id="searchBtn" aria-label="Search"><svg width="25" height="25" viewBox="0 0 24 24"><circle class="icon-stroke" cx="11" cy="11" r="6.5"/><path class="icon-stroke" d="m16 16 4 4"/></svg></button>
<button class="icon-btn" aria-label="Notifications"><svg width="25" height="25" viewBox="0 0 24 24"><path class="icon-stroke" d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path class="icon-stroke" d="M10 21h4"/></svg></button>
</div></div></header>
<main class="app-scroll home-scroll"><div class="home-content">
<section class="profile-card"><div class="avatar"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div><div class="profile-title">Hello, Username</div><div class="profile-points"><strong>240</strong> Points Earned</div></div><svg width="20" height="20" viewBox="0 0 24 24" style="color:#999"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></section>
<section class="home-promo placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg><div class="carousel-controls"><button><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m14 7-5 5 5 5"/></svg></button><button class="pause-circle">Ⅱ</button><button><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m10 7 5 5-5 5"/></svg></button></div></section>
<section class="home-shortcuts">
<a class="shortcut" href="./order-again/"><svg class="big" viewBox="0 0 24 24"><path class="icon-stroke" d="M4 5v5h5"/><path class="icon-stroke" d="M5.7 16a8 8 0 1 0 .3-8"/></svg><strong>Order Again</strong><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></a>
<a class="shortcut" href="./favorites/"><svg class="big" viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><strong>Favorites</strong><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></a>
</section>
<h1 class="home-heading">Order Now</h1><section class="category-grid" id="homeCategories"></section>
</div></main>
<nav class="bottom-nav">
<a class="nav-btn active" href="./"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m4 10 8-6 8 6v10H4Z"/><path class="icon-stroke" d="M9 20v-6h6v6"/></svg><span>Home</span></a>
<a class="nav-btn" href="./menu/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></a>
<a class="nav-btn rewards-label" href="./rewards/"><span class="reward-float"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M8 4h8v8a4 4 0 0 1-8 0Z"/><path class="icon-stroke" d="M9 18h6M12 16v2"/><path class="icon-stroke" d="M8 7H5v2a3 3 0 0 0 3 3M16 7h3v2a3 3 0 0 1-3 3"/></svg></span><span>Rewards</span></a>
<a class="nav-btn" href="./favorites/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><span>Favorites</span></a>
<a class="nav-btn" href="./account/"><svg viewBox="0 0 24 24"><circle class="icon-stroke" cx="12" cy="8" r="3.5"/><path class="icon-stroke" d="M5 20a7 7 0 0 1 14 0"/></svg><span>Account</span></a>
</nav>
<section class="search-overlay" id="searchOverlay"><div class="search-header"><div class="search-box"><svg width="19" height="19" viewBox="0 0 24 24"><circle class="icon-stroke" cx="11" cy="11" r="6.5"/><path class="icon-stroke" d="m16 16 4 4"/></svg><input id="searchInput" placeholder="Search menu..."></div><button class="search-cancel" id="searchCancel">Cancel</button></div><div class="search-results"><div class="search-label">MENU ITEMS</div><div id="searchResults"></div></div></section><div class="toast"></div></div>
<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState;
document.getElementById("homeCategories").innerHTML=menu.categories.filter(c=>c.items.length).map(c=>`<a class="category-card" href="./menu/#${c.id}"><div class="category-image placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div class="category-label">${c.label}</div></a>`).join("");
const overlay=document.getElementById("searchOverlay"),input=document.getElementById("searchInput"),results=document.getElementById("searchResults");
function drawSearch(q=""){q=q.trim().toLowerCase();results.innerHTML=Object.values(menu.items).filter(i=>!q||i.name.toLowerCase().includes(q)).map(i=>`<a class="search-row" href="./item/?id=${i.id}"><div class="search-thumb placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div class="search-name">${i.name}</div><div class="search-price">$${i.price.toFixed(2)}</div></a>`).join("")}
drawSearch();document.getElementById("searchBtn").onclick=()=>{overlay.classList.add("show");setTimeout(()=>input.focus(),50)};document.getElementById("searchCancel").onclick=()=>{overlay.classList.remove("show");input.value="";drawSearch()};input.oninput=()=>drawSearch(input.value);
</script></body></html>
