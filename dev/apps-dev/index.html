<script src="./js/app.js"></script><script>

    return w[w.length - 1];
  })();
  v = u && u.nonce;

  s = a.createElement('script');
  s.src = z + '?apiKey=' + e;
  s.async = true;
  if (v) s.setAttribute('nonce', v);
  a.getElementsByTagName('head')[0].appendChild(s);

<body><div class="app-shell">
<header class="top-red"><div class="top-red-row"><div class="pickup"><small>Pick up from</small><strong>Beverly <svg width="14" height="14" viewBox="0 0 24 24"><path class="icon-stroke" d="m7 9 5 5 5-5"/></svg></strong></div><div class="header-actions">
<button class="icon-btn" id="searchBtn" aria-label="Search"><svg width="25" height="25" viewBox="0 0 24 24"><circle class="icon-stroke" cx="11" cy="11" r="6.5"/><path class="icon-stroke" d="m16 16 4 4"/></svg></button>

</div></div></header>
<main class="app-scroll home-scroll"><div class="home-content">
<section class="profile-card"><div class="avatar"><img src="/HTML-CSS-Javascript-Copilot-Playground/apps/images/jollibee-logo.png" alt="" style="width:100%;height:100%;object-fit:contain;display:block"></div><div><div class="profile-title">Hello, Username</div><div class="profile-points"><strong>240</strong> Points Earned</div></div><svg width="20" height="20" viewBox="0 0 24 24" style="color:#999"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></section>
<section class="home-promo" id="homePromo"><div class="promo-track" id="promoTrack">
<div class="promo-slide"><img src="/HTML-CSS-Javascript-Copilot-Playground/apps/images/banner-chickenjoy.png" alt="Chickenjoy - Next-Level Juicy, Next-Level Crispy"></div>
<div class="promo-slide"><img src="/HTML-CSS-Javascript-Copilot-Playground/apps/images/banner-chicken-sandwiches.png" alt="Jollibee Chicken Sandwiches - Spicy and Original"></div>
<div class="promo-slide"><img src="/HTML-CSS-Javascript-Copilot-Playground/apps/images/banner-chicken-nuggets.png" alt="New Jollibee Chicken Nuggets"></div>
</div><div class="carousel-controls"><button id="promoPrev" aria-label="Previous slide"><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m14 7-5 5 5 5"/></svg></button><button class="pause-circle" id="promoPause" aria-label="Pause carousel">Ⅱ</button><button id="promoNext" aria-label="Next slide"><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m10 7 5 5-5 5"/></svg></button></div></section>
<section class="home-shortcuts">
<a class="shortcut home-order-again-primary" href="./order-again/"><svg class="big" viewBox="0 0 24 24"><path class="icon-stroke" d="M4 5v5h5"/><path class="icon-stroke" d="M5.7 16a8 8 0 1 0 .3-8"/></svg><strong>Order Again</strong><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></a>
<a class="shortcut home-favorites-secondary" href="./favorites/"><svg class="big" viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><strong>Favorites</strong><svg width="17" height="17" viewBox="0 0 24 24"><path class="icon-stroke" d="m9 6 6 6-6 6"/></svg></a>
</section>

<svg viewBox="0 0 24 24"><path class="icon-stroke" d="M3 4h2l2.5 11h10l2-7H6"/><circle class="icon-stroke" cx="9" cy="20" r="1"/><circle class="icon-stroke" cx="18" cy="20" r="1"/></svg>
<span class="cart-badge" id="homeCartBadge"></span>
</a>
<nav class="bottom-nav">
  <a class="nav-btn active" href="./"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m4 10 8-6 8 6v10H4Z"/><path class="icon-stroke" d="M9 20v-6h6v6"/></svg><span>Home</span></a>
  <a class="nav-btn " href="./menu/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></a>

  <a class="nav-btn " href="./favorites/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><span>Favorites</span></a>

</nav>

<section class="search-overlay" id="searchOverlay"><div class="search-header"><div class="search-box"><svg width="19" height="19" viewBox="0 0 24 24"><circle class="icon-stroke" cx="11" cy="11" r="6.5"/><path class="icon-stroke" d="m16 16 4 4"/></svg><input id="searchInput" placeholder="Search menu..."></div><button class="search-cancel" id="searchCancel">Cancel</button></div><div class="search-results"><div class="search-label">MENU ITEMS</div><div id="searchResults"></div></div></section>
<div class="toast"></div>
</div>
<script>
const menu=window.JOLLIBEE_MENU, S=window.JolliState;
const categoryImages={nuggets:"category-nuggets.jpg",chickenjoy:"category-chickenjoy.jpg",sandwiches:"category-sandwiches.png",family:"category-family-meals.jpg",tenders:"category-tenders.png",spaghetti:"category-spaghetti.jpg","burger-steak":"category-burger-steak.jpg",sides:"category-sides.png",drinks:"category-drinks.jpg",desserts:"category-desserts.jpg"};
document.getElementById("homeCategories").innerHTML=menu.categories.filter(c=>c.items.length).map(c=>{const img=categoryImages[c.id];const thumb=img?`<div class="category-image"><img src="/HTML-CSS-Javascript-Copilot-Playground/apps/images/${img}" alt="${c.label}" style="width:100%;height:100%;object-fit:contain;display:block"></div>`:`<div class="category-image placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div>`;return `<a class="category-card" href="./menu/#${c.id}">${thumb}<div class="category-label">${c.label}</div></a>`}).join("");
function updateCartIcon(){
  const n=S.cartCount(), fab=document.getElementById("homeCartFab");
  fab.classList.toggle("show",n>0);
  document.getElementById("homeCartBadge").textContent=n;
}
updateCartIcon();
const overlay=document.getElementById("searchOverlay"),input=document.getElementById("searchInput"),results=document.getElementById("searchResults");
function drawSearch(q=""){q=q.trim().toLowerCase();results.innerHTML=Object.values(menu.items).filter(i=>!q||i.name.toLowerCase().includes(q)).map(i=>`<a class="search-row" href="./item/?id=${i.id}"><div class="search-thumb placeholder"><svg viewBox="0 0 24 24"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div><div class="search-name">${i.name}</div><div class="search-price">$${i.price.toFixed(2)}</div></a>`).join("")}
drawSearch();
document.getElementById("searchBtn").onclick=()=>{overlay.classList.add("show");setTimeout(()=>input.focus(),50)};
document.getElementById("searchCancel").onclick=()=>{overlay.classList.remove("show");input.value="";drawSearch()};
input.oninput=()=>drawSearch(input.value);
(function(){
const track=document.getElementById("promoTrack"),slides=track.children.length;
const firstClone=track.children[0].cloneNode(true);
firstClone.setAttribute("aria-hidden","true");
track.appendChild(firstClone);
const slidesEls=[...track.children];
let idx=0,playing=true,timer,resetPending=false;
function center(i){const el=slidesEls[i];return el.offsetLeft-(track.clientWidth-el.offsetWidth)/2}
function advance(){
  idx++;
  track.scrollTo({left:center(idx),behavior:"smooth"});
  if(idx===slides)resetPending=true;
}
function prev(){idx=(idx-1+slides)%slides;track.scrollTo({left:center(idx),behavior:"smooth"})}
track.addEventListener("scrollend",()=>{
  if(resetPending){resetPending=false;idx=0;track.scrollTo({left:center(0),behavior:"auto"})}
});
function start(){timer=setInterval(advance,4000)}
function stop(){clearInterval(timer)}
document.getElementById("promoPrev").onclick=()=>{prev()};
document.getElementById("promoNext").onclick=()=>{advance()};
const pauseBtn=document.getElementById("promoPause");
pauseBtn.onclick=()=>{playing=!playing;pauseBtn.textContent=playing?"Ⅱ":"▶";playing?start():stop()};
start();
})();
</script></body></html>
