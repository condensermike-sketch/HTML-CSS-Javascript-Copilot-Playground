<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Favorites</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css?v=2"><script src="../js/menu-data.js"></script><script src="../js/app.js"></script></head><body><div class="app-shell"><div class="white-topbar"><a class="back-btn" href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m15 18-6-6 6-6"/></svg></a><div class="topbar-title">Favorites</div><div></div></div><main class="app-scroll list-page-scroll"><div class="list-page-content"><div id="favorites"></div></div></main><nav class="bottom-nav"><a class="nav-btn" href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m4 10 8-6 8 6v10H4Z"/><path class="icon-stroke" d="M9 20v-6h6v6"/></svg><span>Home</span></a><a class="nav-btn" href="../menu/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></a><a class="nav-btn rewards-label" href="../rewards/"><span class="reward-float"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M8 4h8v8a4 4 0 0 1-8 0Z"/></svg></span><span>Rewards</span></a><a class="nav-btn" href="../favorites/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><span>Favorites</span></a><a class="nav-btn" href="../account/"><svg viewBox="0 0 24 24"><circle class="icon-stroke" cx="12" cy="8" r="3.5"/><path class="icon-stroke" d="M5 20a7 7 0 0 1 14 0"/></svg><span>Account</span></a></nav><div class="toast"></div></div><script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,el=document.getElementById("favorites");function draw(){const f=S.favorites();if(!f.length){el.innerHTML=`<div class="empty-state"><h2>No favorites yet</h2><p>Tap the heart on a menu item or previous order to save it here.</p><a class="yellow" href="../menu/">Browse Menu</a></div>`;return}el.innerHTML=`<div class="fav-grid">${f.map(x=>{const i=x.itemId?menu.items[x.itemId]:menu.items[x.addonId];if(!i)return"";return `<article class="fav-card"><a href="../item/?id=${i.id}" style="text-decoration:none"><div class="placeholder"></div><div class="fav-body"><div class="fav-name">${i.name}</div><div class="fav-meta">${x.itemId?S.customizationParts(x.itemId,x.customizations||{}).join(" · "):"Saved from a previous order"}</div><div class="fav-price">${S.fmt(i.price)}</div></div></a><button class="fav-heart" data-remove="${x.itemId||x.addonId}">♥</button></article>`}).join("")}</div>`;document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{const id=b.dataset.remove;if(S.isFavorite(id))S.removeFavorite(id);else if(S.isAddonFavorite(id))S.removeAddonFavorite(id);draw()})}draw();
</script></body></html>
