<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Order Again</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/styles.css?v=4"><script src="../js/menu-data.js"></script><script src="../js/app.js"></script></head><body><div class="app-shell"><div class="white-topbar with-cart"><a class="back-btn" href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m15 18-6-6 6-6"/></svg></a><div class="topbar-title">Order Again</div><a class="header-cart" href="../cart/" data-cart-label><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M3 4h2l2.5 11h10l2-7H6"/><circle class="icon-stroke" cx="9" cy="20" r="1"/><circle class="icon-stroke" cx="18" cy="20" r="1"/></svg><span class="cart-badge" data-cart-count>0</span></a></div><main class="app-scroll list-page-scroll"><div class="list-page-content"><h1 class="page-title" style="margin-bottom:14px">Order Again</h1><div id="orders"></div></div></main><nav class="bottom-nav"><a class="nav-btn" href="../"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="m4 10 8-6 8 6v10H4Z"/><path class="icon-stroke" d="M9 20v-6h6v6"/></svg><span>Home</span></a><a class="nav-btn" href="../menu/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></a><a class="nav-btn rewards-label" href="../rewards/"><span class="reward-float"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M8 4h8v8a4 4 0 0 1-8 0Z"/></svg></span><span>Rewards</span></a><a class="nav-btn" href="../favorites/"><svg viewBox="0 0 24 24"><path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/></svg><span>Favorites</span></a><a class="nav-btn" href="../account/"><svg viewBox="0 0 24 24"><circle class="icon-stroke" cx="12" cy="8" r="3.5"/><path class="icon-stroke" d="M5 20a7 7 0 0 1 14 0"/></svg><span>Account</span></a></nav><div class="toast"></div></div><script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,orders=[...S.sessionOrders(),...menu.seededOrders];function price(e){if(e.itemId)return S.configuredItemUnitPrice(e.itemId,e.customizations||{})*(e.quantity||1);const u=menu.upsells.find(x=>x.id===e.addonId);return(u?u.price:0)*(e.quantity||1)}function draw(){document.getElementById("orders").innerHTML=orders.map((o,idx)=>`<article class="order-card"><div class="order-head"><strong>${o.fulfillment||"Previous Order"}</strong><span class="order-date">${o.dateLabel||""}</span></div><div class="order-lines">${(o.items||[]).map(e=>`<div class="order-line"><div class="order-line-copy"><strong>${e.quantity||1}× ${e.itemId?(menu.items[e.itemId]?.shortName||menu.items[e.itemId]?.name):menu.upsells.find(x=>x.id===e.addonId)?.name||"Add-on"}</strong>${e.itemId?`<span>${S.customizationParts(e.itemId,e.customizations||{}).join(" · ")}</span>`:""}</div></div>`).join("")}</div><div class="order-total">${S.fmt((o.items||[]).reduce((n,e)=>n+price(e),0))}</div><button class="primary" data-reorder="${idx}">Reorder</button></article>`).join("");document.querySelectorAll("[data-reorder]").forEach(b=>b.onclick=()=>{S.setCart((orders[Number(b.dataset.reorder)].items||[]).map(x=>JSON.parse(JSON.stringify(x))));location.href="../cart/"})}draw();
</script></body></html>
