</div>
<script>
const menu=window.JOLLIBEE_MENU,S=window.JolliState,orders=[...S.sessionOrders(),...menu.seededOrders];

function addonIsFavorite(addonId){
  if(typeof S.isAddonFavorite==="function") return S.isAddonFavorite(addonId);
  return (S.favorites?S.favorites():S.get("favorites",[])).some(f=>f.addonId===addonId);
}

function toggleAddonFavorite(addonId){
  if(typeof S.favoriteAddon==="function") return S.favoriteAddon(addonId);

  let favs=S.favorites?S.favorites():S.get("favorites",[]);
  const idx=favs.findIndex(f=>f.addonId===addonId);
  const added=idx<0;
  if(added) favs.unshift({addonId});
  else favs.splice(idx,1);
  S.set("favorites",favs);
  return added;
}

function price(entry){
  if(entry.itemId)return S.configuredItemUnitPrice(entry.itemId,entry.customizations||{})*(entry.quantity||1);
  const u=menu.upsells.find(x=>x.id===entry.addonId);
  return (u?u.price:0)*(entry.quantity||1)
}

function lineImage(entry){
  const item=entry.itemId?menu.items[entry.itemId]:menu.items[entry.addonId];
  const name=item?.name||"Food item";
  return item?.image
    ? `<div class="order-line-thumb"><img src="../images/${item.image}" alt="${name}"></div>`
    : `<div class="order-line-thumb"><svg viewBox="0 0 24 24" aria-hidden="true"><rect class="icon-stroke" x="4" y="4" width="16" height="16" rx="2"/><circle class="icon-stroke" cx="9" cy="9" r="2"/><path class="icon-stroke" d="m5 17 4-4 3 3 2-2 5 5"/></svg></div>`;
}

function fulfillmentIcon(fulfillment){
  const isDriveThru=/drive[-\s]?thru/i.test(fulfillment||"");
  return isDriveThru
    ? `<wa-icon library="lucide" name="car" aria-hidden="true"></wa-icon>`
    : `<wa-icon library="lucide" name="shopping-bag" aria-hidden="true"></wa-icon>`;
}

function itemLine(entry,orderIndex,lineIndex){
  if(entry.itemId){
    const i=menu.items[entry.itemId];
    const meta=S.customizationParts(entry.itemId,entry.customizations||{}).join(" · ");
    const active=S.isFavorite(entry.itemId);
    return `<div class="order-line">
      ${lineImage(entry)}
      <div class="order-line-copy">
        <strong>${entry.quantity||1}× ${i.shortName||i.name}</strong>
        ${meta?`<span>${meta}</span>`:""}
      </div>
      <button class="order-favorite ${active?"active":""}"
              data-fav-order="${orderIndex}"
              data-fav-line="${lineIndex}"
              aria-label="${active?"Remove from Favorites":"Save to Favorites"}"
              title="${active?"Remove from Favorites":"Save to Favorites"}">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/>
        </svg>
      </button>
    </div>`;
  }

  const u=menu.upsells.find(x=>x.id===entry.addonId);
  const active=addonIsFavorite(entry.addonId);
  return `<div class="order-line">
    ${lineImage(entry)}
    <div class="order-line-copy">
      <strong>${entry.quantity||1}× ${u?u.name:"Add-on"}</strong>
      ${u?`<span>${S.fmt(u.price)}</span>`:""}
    </div>
    <button class="order-favorite addon-favorite ${active?"active":""}"
            data-fav-addon-order="${orderIndex}"
            data-fav-addon-line="${lineIndex}"
            aria-label="${active?"Remove from Favorites":"Save to Favorites"}"
            title="${active?"Remove from Favorites":"Save to Favorites"}">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="icon-stroke" d="M20.8 4.8a5.3 5.3 0 0 0-7.5 0L12 6.1l-1.3-1.3a5.3 5.3 0 0 0-7.5 7.5L12 21l8.8-8.7a5.3 5.3 0 0 0 0-7.5Z"/>
      </svg>
    </button>
  </div>`;
}

function drawOrders(){
  document.getElementById("orders").innerHTML=orders.map((o,idx)=>{
    const total=(o.items||[]).reduce((n,e)=>n+price(e),0);
    const fulfillment=o.fulfillment||"Previous Order";
    return `<article class="order-card">
      <div class="order-head">
        <strong class="order-fulfillment">${fulfillmentIcon(fulfillment)}<span>${fulfillment}</span></strong>
        <span class="order-date">${o.dateLabel||""}</span>
      </div>
      <div class="order-lines">
        ${(o.items||[]).map((e,lineIdx)=>itemLine(e,idx,lineIdx)).join("")}
      </div>
      <div class="order-total">${S.fmt(total)}</div>
      <button class="primary" data-reorder="${idx}">Reorder</button>
    </article>`;
  }).join("");

  document.querySelectorAll("[data-reorder]").forEach(b=>b.onclick=()=>{
    const o=orders[Number(b.dataset.reorder)];
    S.setCart((o.items||[]).map(x=>JSON.parse(JSON.stringify(x))));
    location.href="../cart/";
  });

  document.querySelectorAll("[data-fav-order]").forEach(b=>b.onclick=()=>{
    const oi=Number(b.dataset.favOrder);
    const li=Number(b.dataset.favLine);
    const entry=orders[oi]?.items?.[li];
    if(!entry || !entry.itemId)return;

    const added=S.favoriteItem(entry.itemId,entry.customizations||{});
    S.showToast(added?"Saved to Favorites":"Removed from Favorites");
    drawOrders();
  });

  document.querySelectorAll("[data-fav-addon-order]").forEach(b=>b.onclick=()=>{
    const oi=Number(b.dataset.favAddonOrder);
    const li=Number(b.dataset.favAddonLine);
    const entry=orders[oi]?.items?.[li];
    if(!entry || !entry.addonId)return;

    const added=toggleAddonFavorite(entry.addonId);
    S.showToast(added?"Saved to Favorites":"Removed from Favorites");
    drawOrders();
  });
}

drawOrders();
</script></body></html>
